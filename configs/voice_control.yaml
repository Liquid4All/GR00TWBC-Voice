audio:
  backend: "whisper_cpp"
  source: "device"
  sample_rate: 16000
  device: null
  frame_ms: 30
  vad: true
  vad_aggressiveness: 2
  phrase_timeout_s: 1.0
  max_utterance_s: 8.0
  mcast_group: "239.168.123.161"
  mcast_port: 5555
  mcast_iface_ip: null

wake:
  mode: "push_to_talk"
  phrase: "hey sonic"

asr:
  whisper_cpp_bin: "third_party/whisper.cpp/build/bin/whisper-cli"
  whisper_model_path: "models/whisper/ggml-base.en.bin"
  whisper_language: "en"
  whisper_extra_args: null

parser:
  backend: "deterministic"
  confidence_threshold: 0.75
  duration_min_s: 0.5
  duration_max_s: 120.0

safety:
  dry_run: true
  execute: false
  command_timeout_s: 2.0

publisher:
  backend: "stub"
  local_planner_endpoint: "tcp://127.0.0.1:5556"
  zmq_endpoint: "tcp://127.0.0.1:5556"
  zmq_bind: true
  planner_dt: 0.1
  segment_dwell_s: 3.0

logging:
  level: "INFO"
  log_file: "logs/voice_control.log"
