# Offline voice control configuration for the SONIC kinematic planner.
# Safe defaults: dry-run is ON and execute is OFF. No cloud services, no LLM.

audio:
  backend: "whisper_cpp"     # "whisper_cpp" (default) | "vosk"
  source: "device"           # "device" (sound card) | "multicast" (Unitree G1 mic)
  sample_rate: 16000
  device: null               # sound-card index (source=device); null = system default
  frame_ms: 30               # VAD frame size; webrtcvad allows 10/20/30 only
  vad: true
  vad_aggressiveness: 2      # 0..3 (webrtcvad)
  phrase_timeout_s: 1.0      # trailing silence that ends an utterance
  max_utterance_s: 8.0
  # Unitree G1 onboard mic (used when source == "multicast"). The robot's voice
  # service multicasts 16 kHz mono PCM; join on the 192.168.123.x interface.
  mcast_group: "239.168.123.161"
  mcast_port: 5555
  mcast_iface_ip: null       # this host's 192.168.123.x IP; null = auto-detect

wake:
  mode: "push_to_talk"       # no_wake_debug | push_to_talk | wake_word | vad_only
  phrase: "hey sonic"
  require_wake_word_for_motion: true

asr:
  vosk_model_path: "models/vosk-model-small-en-us"
  # whisper.cpp: build the binary and download the base.en GGML model.
  whisper_cpp_bin: "third_party/whisper.cpp/build/bin/whisper-cli"
  whisper_model_path: "models/whisper/ggml-base.en.bin"

parser:
  confidence_threshold: 0.75
  duration_min_s: 0.5        # sanity floor for a per-step dwell (composed commands)
  duration_max_s: 120.0      # sanity ceiling for a per-step dwell

safety:
  dry_run: true              # never send to the robot unless false AND execute true
  execute: false             # must be true (with dry_run false) to move a real robot
  command_timeout_s: 2.0     # watchdog: stop if no fresh command within this window

publisher:
  backend: "stub"            # stub | existing_repo | zmq | ros2
  zmq_endpoint: "tcp://127.0.0.1:5556"   # ZMQManager planner-input port (NOT 5557 = debug out)
  ros2_topic: "/sonic/planner_command"
  planner_dt: 0.1            # 10 Hz replan/hold rate
  segment_dwell_s: 3.0       # fallback per-step dwell when no duration is set/estimated

logging:
  level: "INFO"
  log_file: "logs/voice_control.log"
