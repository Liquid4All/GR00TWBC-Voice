audio:
  backend: "whisper_cpp"
  source: "device"
  sample_rate: 16000
  device: null
  frame_ms: 30
  vad: true
  vad_aggressiveness: 2
  phrase_timeout_s: 1.0
  max_utterance_s: 8.0
  mcast_group: "239.168.123.161"
  mcast_port: 5555
  mcast_iface_ip: null

wake:
  mode: wake_word
  phrase: "hey jarvis"
  oww_model: hey_jarvis
  oww_threshold: 0.5
  oww_patience: 2
  oww_inference_framework: onnx

asr:
  whisper_cpp_bin: "third_party/whisper.cpp/build/bin/whisper-cli"
  whisper_model_path: "models/whisper/ggml-base.en.bin"
  whisper_language: "en"
  whisper_extra_args: null

parser:
  backend: "deterministic"
  confidence_threshold: 0.75
  duration_min_s: 0.5
  duration_max_s: 120.0
  # LFM G1 function-calling parser (set backend: lfm_g1)
  lfm_model_id: "/GR00T-WBC/models/lfm_g1"
  lfm_device: cpu
  lfm_max_new_tokens: 512
  lfm_temperature: 0.1
  lfm_top_k: 50
  lfm_default_duration_s: 3.0
  lfm_default_velocity_mps: 0.5
  lfm_default_yaw_rate_dps: 45.0
  lfm_default_height_m: 0.5
  # Optional: run LFM on a laptop (torch>=2.4 + transformers>=5) and POST text here.
  # lfm_remote_url: "http://192.168.123.100:8765/parse"

safety:
  dry_run: true
  execute: false
  command_timeout_s: 2.0

publisher:
  backend: "local_planner"
  local_planner_endpoint: "tcp://127.0.0.1:5556"
  zmq_endpoint: "tcp://127.0.0.1:5556"
  zmq_bind: true
  planner_dt: 0.1
  segment_dwell_s: 3.0

logging:
  level: "INFO"
  log_file: "logs/voice_control.log"
